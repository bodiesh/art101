<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Environment 03</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="env.js" defer></script>
    <link href="env02.css" rel="stylesheet" type="text/css">
</head>
<body>

<label for="activities"><h1><mark>hello welcome to the ocean</mark></h1></label>

<div id="activity-soundtrack">
    <h2><mark>what do you like to do in the ocean?</mark></h2>

    <select name="activities" id="activities">
        <option value="1">scuba diving</option>
        <option value="2">surfing</option>
        <option value="3">snorkeling</option>
        <option value="4">none</option>
    </select>

</div>

<div id="water">

<img src="fish1.jpg">
<div class="right-side-up" id="seahorse">
    <img src="seahorse.webp">
</div>
<a href="https://www.youtube.com/watch?v=XWvARJA06Ow">
<img src="boot.webp">
</a>
</div>

<div id="environment-output"><h2><mark>who would you like to hang out with?</mark></h2>
    <button id=fish-button>fish</button>
    <button id=seahorse-button>seahorse</button>
    <button id=boot-button><a href=https://www.youtube.com/watch?v=XWvARJA06Ow class="button-link">boot</a></button>
</div>

<div id="ocean-floor">

<img src="ocean-floor.png">

</div>

<audio id="surfing-sound" src="surfing-sound.mp3"></audio>
<audio id="scuba-sound" src="scuba-sound.mp3"></audio>
<audio id="snorkeling-sound" src="snorkeling-sound.mp3"></audio>


</body>
</html>
